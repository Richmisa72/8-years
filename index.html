<!doctype html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>8年</title>
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" type="image/svg+xml" href="icon.svg?v=2">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
<meta name="apple-mobile-web-app-title" content="8年">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap">
<style>
/* Layout: one phone-width column, pill-shaped cards stacked like the reference; floating black tab bar at the bottom. */
:root{
  --bg:#F5F4EF; --surface:#FFFFFF; --muted:#E8E8E4; --muted-2:#D9D9D4;
  --fg:#1B1B1B; --fg-2:#6E6E68; --line:#E3E3DE;
  --ink-card:#262626; --on-ink:#F6F6F2; --on-ink-2:#B9B9B2;
  --nav:#1F1F1F; --nav-btn:#3A3A3A; --nav-on:#FFFFFF;
  --lime:#E4F47C; --lime-deep:#A9BA2E; --lav:#DCB9F7; --lav-soft:#F1E4FC; --on-lav:#1B1B1B; --blue:#4553CC; --orange:#EE5F38;
  --peach:#FFC59E; --beige:#F3EAD6; --tr:#E3E7FB; --land:#F2F0E8; --sea:#D6E4F2; --sea-2:#BBD2EA; --rail:#B2B4B7; --dot:#EE5F38;
  --on-accent:#1B1B1B; --warn:#B4531A; --warn-bg:#FBEBDD;
  --hatch-light:rgba(255,255,255,.38); --hatch-dark:rgba(0,0,0,.06);
  --f-display:"Manrope","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Manrope","Noto Sans TC",system-ui,sans-serif;
  --r-xl:30px; --r-pill:999px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F0F0F; --surface:#181818; --muted:#232323; --muted-2:#2E2E2E;
  --fg:#EEEEEA; --fg-2:#9C9C95; --line:#2A2A2A;
  --ink-card:#2A2A2D; --on-ink:#F4F4F0; --on-ink-2:#A9A9A2;
  --nav:#262628; --nav-btn:#3A3A3D; --nav-on:#F4F4F0;
  --lime:#E4F47C; --lime-deep:#C9DA52; --lav:#DCB9F7; --lav-soft:#3A2D46; --on-lav:#1B1B1B; --blue:#5361DB; --orange:#EE5F38;
  --peach:#FFC59E; --beige:#F3EAD6; --tr:#E3E7FB; --land:#1E1E1E; --sea:#1C2633; --sea-2:#2A3A50; --rail:#4A4A4A; --dot:#EE5F38;
  --warn:#F0A060; --warn-bg:#3A2716; --hatch-dark:rgba(255,255,255,.06);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F0F0F; --surface:#181818; --muted:#232323; --muted-2:#2E2E2E;
  --fg:#EEEEEA; --fg-2:#9C9C95; --line:#2A2A2A;
  --ink-card:#2A2A2D; --on-ink:#F4F4F0; --on-ink-2:#A9A9A2;
  --nav:#262628; --nav-btn:#3A3A3D; --nav-on:#F4F4F0;
  --lime:#E4F47C; --lime-deep:#C9DA52; --lav:#DCB9F7; --lav-soft:#3A2D46; --on-lav:#1B1B1B; --blue:#5361DB; --orange:#EE5F38;
  --peach:#FFC59E; --beige:#F3EAD6; --tr:#E3E7FB; --land:#1E1E1E; --sea:#1C2633; --sea-2:#2A3A50; --rail:#4A4A4A; --dot:#EE5F38;
  --warn:#F0A060; --warn-bg:#3A2716; --hatch-dark:rgba(255,255,255,.06);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2.5px solid var(--lav);outline-offset:2px}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}

.app{max-width:460px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 120px;display:flex;flex-direction:column;gap:16px}
.view{display:flex;flex-direction:column;gap:14px}

/* header */
.top{display:flex;align-items:center;gap:12px}
.top .grow{flex:1;min-width:0}
.eyebrow{font-size:12px;color:var(--fg-2);letter-spacing:.06em}
.h1{font-family:var(--f-display);font-weight:600;font-size:24px;line-height:1.2;margin:2px 0 0;text-wrap:balance}
.circle{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none;position:relative}
.circle.ink{background:var(--nav);color:var(--nav-on)}
.circle.lav{background:var(--lav-soft);color:var(--fg)}
.circle.grey{background:var(--muted);color:var(--fg)}
.circle .dot{position:absolute;top:4px;right:4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--lime);color:var(--on-accent);font:700 11px/18px var(--f-display);text-align:center}
.circle svg{width:20px;height:20px}

/* countdown */
.count{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;background:var(--surface);border-radius:var(--r-xl);padding:18px 20px}
.count b{font-family:var(--f-display);font-size:54px;line-height:.9;font-weight:600;letter-spacing:-.02em}
.count small{display:block;font-size:13px;color:var(--fg-2)}
.count .right{text-align:right;font-size:13px;color:var(--fg-2)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-2px;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 6px 0 16px;border-radius:var(--r-pill);background:var(--muted);font-size:14px;font-weight:500;white-space:nowrap}
.chip .n{min-width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface);font:600 13px var(--f-display)}
.chip.lime{background:#F1F4DC;background:color-mix(in srgb,var(--lime) 28%,var(--surface))}
.chip.lime .n{background:var(--lime);color:var(--on-accent)}
.chip.on{background:var(--nav);color:var(--nav-on)}
.chip.on .n{background:var(--lime);color:var(--on-accent)}
.chip.plain{padding:0 16px}

/* day cards: stacked like folders (overlap is small so the card below peeks out at the corners) */
.stack{display:flex;flex-direction:column}
.stk{display:flex;flex-direction:column;padding-top:4px}
.fd{position:relative;background:var(--c);color:var(--t);border-radius:34px;padding:20px 16px 56px 22px}
.fd + .fd{margin-top:-38px}
.fd.open{padding-bottom:58px}
.fd.last{padding-bottom:18px}
.fd .dtog{position:absolute;inset:0;border-radius:inherit;z-index:1}
.fd{overflow:hidden}
.fd .mot{position:absolute;right:-26px;bottom:-30px;width:150px;height:150px;opacity:.13;transform:rotate(-14deg);pointer-events:none}
.fd .mot svg{width:100%;height:100%;stroke-width:1.2}
.fd.open .mot{bottom:54px;opacity:.09}
.fd .dtog:focus:not(:focus-visible){outline:none}
.fd .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.fd h3{flex:1;min-width:0;margin:0;font:500 27px/1.2 var(--f-body);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fd .dt small{font:400 12.5px var(--f-body);margin-right:6px;opacity:.75}
.fd .dt{flex:none;font:500 14px var(--f-display);letter-spacing:.02em;padding:6px 4px 0 0;opacity:.85}
.fd .r2{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.fd .ar{position:relative;z-index:2;flex:none;width:44px;height:44px;border-radius:50%;background:transparent;color:inherit;display:grid;place-items:center;transition:background .2s,transform .2s}
.fd .ar:active{transform:scale(.94)}
.fd.open .ar{background:#1B1B1B;color:#fff}
.fd.dk.open .ar{background:#fff;color:#1B1B1B}
.fd .ar svg{width:24px;height:24px;stroke-width:1.6}
.fd .bd{position:relative;z-index:2;display:flex;flex-direction:column;gap:12px;margin-top:14px}
.fd .ds{margin:0;font:400 14.5px/1.7 var(--f-body);opacity:.75}
.fd .pls{display:flex;flex-wrap:wrap;gap:4px 16px;min-width:0}
.fd .pl{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0;border-radius:0;background:none;font:500 13px var(--f-body);white-space:nowrap}
.fd .pl svg{width:15px;height:15px}
.fd .pl.hot{font-weight:600;gap:6px}
.fd .pl.hot svg{width:17px;height:17px}

.fd .gls{display:flex;flex-direction:column;gap:10px;padding-top:10px}
.fd .pg{display:flex;align-items:baseline;justify-content:space-between;font:500 14px var(--f-body)}
.fd .pg b{font:600 19px var(--f-display);font-variant-numeric:tabular-nums}
.fd .pg small{font-size:13px;opacity:.55}
.fd .pb{height:8px;border-radius:999px;background:rgba(255,255,255,.45);overflow:hidden}
.fd.dk .pb{background:rgba(255,255,255,.22)}
.fd .pb i{display:block;height:100%;border-radius:999px;background:var(--a)}
.fd.dk .stp[aria-checked="true"] .cb{color:var(--c)}
.fd .sts{display:flex;flex-direction:column}
.fd .stp{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:7px 0;color:inherit}
.fd .stp .cb{flex:none;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.6);display:grid;place-items:center;color:transparent}
.fd.dk .stp .cb{background:rgba(255,255,255,.22)}
.fd .stp .cb svg{width:13px;height:13px}
.fd .stp .tx{flex:1;min-width:0;font:400 14.5px/1.4 var(--f-body)}
.fd .stp .tm{flex:none;font:500 12.5px var(--f-display);opacity:.6}
.fd .stp[aria-checked="true"] .cb{background:var(--a);color:var(--c)}
.fd .stp[aria-checked="true"] .tx{opacity:.5;text-decoration:line-through}
.icons{display:flex;gap:8px}
.ib{position:relative;width:40px;height:40px;border-radius:50%;background:var(--muted);color:var(--fg);display:grid;place-items:center;flex:none;text-decoration:none}
.ib svg{width:18px;height:18px}
.ib.sm{width:36px;height:36px}
.ib.sm svg{width:16px;height:16px}
.ib.off{opacity:.45}
.ib.off i{position:absolute;right:-2px;bottom:-2px;width:16px;height:16px;border-radius:50%;background:var(--fg);color:var(--surface);display:grid;place-items:center}
.ib.off i svg{width:10px;height:10px}
.wtx{text-align:left}
.wed{display:flex;flex-direction:column;gap:8px;margin:-2px 0 6px;padding:12px;border-radius:20px;background:var(--surface)}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:8px 6px 14px}
.hero h1{margin:0 0 10px;font:400 24px/1.2 var(--f-body);letter-spacing:.04em}
.cd{display:flex;align-items:baseline;gap:4px;line-height:.82}
.cd b{font:500 104px/.82 var(--f-display);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.cd span{font:400 24px var(--f-body)}
.fold{position:relative;display:flex;flex-direction:column;width:100%;text-align:left;border-radius:34px;padding:22px 22px 62px 24px;color:var(--on-accent)}
.fold:last-child{padding-bottom:20px}
.fold + .fold,.fpanel + .fold{margin-top:-44px}
.fold.lav{background:var(--lav);color:var(--on-lav)}
.fold.lime{background:var(--lime)}
.fold.lav2{background:color-mix(in srgb,var(--lav) 58%,#fff);color:#1B1B1B}
.fold.lime2{background:color-mix(in srgb,var(--lime) 58%,#fff);color:#1B1B1B}
.fold.white{background:var(--surface);color:var(--fg)}
.fold .dtog{position:absolute;inset:0;border-radius:inherit;z-index:1}
.fold .dtog:focus:not(:focus-visible){outline:none}
.fold .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.fold h3{flex:1;min-width:0;margin:6px 0 0;font:400 26px/1.25 var(--f-body);letter-spacing:.03em;word-break:keep-all;overflow-wrap:anywhere}
.fold .rt{flex:none;text-align:right}
.fold .st{display:block;font:400 12.5px/1.3 var(--f-body);letter-spacing:.04em;opacity:.6}
.fold .dt{display:block;font:500 27px/1.15 var(--f-display);letter-spacing:.01em;font-variant-numeric:tabular-nums;margin-top:2px}
.fold .ds{margin:8px 0 0;font:400 14.5px/1.6 var(--f-body);letter-spacing:.02em;opacity:.68}
.fold .ft{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.fold .sy{display:inline-flex;align-items:center;gap:6px;font:500 13.5px var(--f-body);letter-spacing:.02em;opacity:.75}
.fold .sy svg{width:16px;height:16px}
.fold .ar{position:relative;z-index:2;width:38px;height:38px;border-radius:50%;background:#1B1B1B;color:#fff;display:grid;place-items:center;flex:none}
.fold .ar svg{width:16px;height:16px}
.fold.white .ar{background:var(--fg);color:var(--surface)}
.fold.open{padding-bottom:20px}
.fold.open::after{content:"";position:absolute;left:50%;bottom:-11px;width:44px;height:22px;transform:translateX(-50%);background:inherit;border-radius:0 0 22px 22px;z-index:1}
.fpanel{position:relative;margin-top:5px;background:var(--muted);border-radius:34px;padding:22px 18px 62px;display:flex;flex-direction:column;gap:12px}
.fpanel:last-child{padding-bottom:18px}
.fpanel .r{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fpanel .avs{display:flex}
.fpanel .who{display:flex;align-items:center;gap:8px;font-size:14.5px}
.fpanel .who .n{width:32px;height:32px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font:600 14px var(--f-display)}
.fpanel .pg{display:flex;align-items:baseline;justify-content:space-between;font:500 14px var(--f-body)}
.fpanel .pg b{font:600 20px var(--f-display);font-variant-numeric:tabular-nums}
.fpanel .pg b small{font-size:14px;opacity:.5;font-weight:500}
.fpanel .bar{height:10px}
.fpanel .bar span{display:none}
.stops{display:flex;flex-direction:column}
.stop{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:8px 0}
.stop .cb{flex:none;width:24px;height:24px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:transparent;transition:background .15s}
.stop .cb svg{width:13px;height:13px}
.stop .tx{flex:1;min-width:0;font:400 14.5px/1.4 var(--f-body)}
.stop .tm{flex:none;font:500 12.5px var(--f-display);color:var(--fg-2);font-variant-numeric:tabular-nums}
.stop[aria-checked="true"] .cb{background:var(--lime-deep);color:#fff}
.stop[aria-checked="true"] .tx{color:var(--fg-2);text-decoration:line-through}
.tl li.done .row,.tl li.done .cap{opacity:.45}
.av{border:0!important;box-shadow:0 0 0 2.5px var(--muted)}

.days{display:flex;flex-direction:column;gap:6px}
.day{position:relative;display:flex;flex-direction:column;gap:6px;border-radius:var(--r-xl);padding:18px 18px 16px 20px;text-align:left;width:100%;color:var(--on-accent)}
.day .dtog{position:absolute;inset:0;border-radius:inherit;z-index:1}
.day .dt{display:flex;align-items:baseline;gap:8px;flex:1;min-width:0}
.day .dt b{font:600 30px/1 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.day .dt span{font-size:14px;font-weight:500;opacity:.75}
.day.ink{background:var(--ink-card);color:var(--on-ink)}
.day.lime{background:var(--lime)}
.day.lav{background:var(--lav);color:var(--on-lav)}
.day.lav .tag{color:var(--on-lav)}
.day.grey{background:var(--muted);color:var(--fg)}
.day.plain{background:var(--surface);color:var(--fg)}
.day.plain .go{background:var(--muted);color:var(--fg)}
.team .stayrow{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500}
.team .stayrow i{width:34px;height:34px;border-radius:50%;background:var(--surface);display:grid;place-items:center}
.team .stayrow svg{width:17px;height:17px}
.day .row1{display:flex;gap:10px;align-items:flex-start}
.day h3{flex:1;min-width:0;margin:0 0 22px;font:500 20px/1.3 var(--f-display);text-wrap:pretty}
.day .tag{flex:none;font:600 13px var(--f-display);padding-top:5px;white-space:nowrap}
.day.ink .tag{color:var(--lime)}
.day .go{position:relative;z-index:2;flex:none;width:44px;height:44px;border-radius:50%;background:#fff;color:#1B1B1B;display:grid;place-items:center;margin:-4px -2px 0 0}
.day .go svg{width:18px;height:18px}
.day .row2{display:flex;align-items:center;justify-content:space-between;gap:10px}
.day .when{display:flex;align-items:center;gap:7px;font:600 14px var(--f-display)}
.day .when svg{width:17px;height:17px}
.day .stay{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;padding:8px 14px;border-radius:var(--r-pill);border:1.5px solid rgba(255,255,255,.75);background:rgba(255,255,255,.5);white-space:nowrap}
.day.ink .stay{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3)}
.day.grey .stay{border-color:var(--surface);background:var(--surface)}
.day .stay svg{width:16px;height:16px}
.day.open{border-bottom-left-radius:var(--r-xl);border-bottom-right-radius:var(--r-xl)}
.day.open::after{content:"";position:absolute;left:50%;bottom:-11px;width:48px;height:22px;transform:translateX(-50%);background:inherit;border-radius:0 0 24px 24px;z-index:1}

.team{background:var(--muted);border-radius:var(--r-xl);padding:22px 18px 16px;display:flex;flex-direction:column;gap:14px;margin-top:-2px}
.team .cnt{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--fg-2)}
.team .cnt b{width:34px;height:34px;border-radius:50%;background:var(--surface);color:var(--fg);display:grid;place-items:center;font:600 14px var(--f-display)}
.bar.btn{display:block;width:100%;text-align:left}
.bar.done i{width:100%!important}
.bar span{color:var(--fg)!important}
.bar.done span{color:var(--on-accent)!important}
.team .r{display:flex;align-items:center;justify-content:space-between;gap:10px}
.avs{display:flex}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:600 13px var(--f-body);border:2.5px solid var(--muted);margin-left:-8px}
.av:first-child{margin-left:0}
.av.a{background:var(--lime);color:var(--on-accent)}.av.b{background:var(--lav);color:var(--on-lav)}.av.c{background:var(--surface);color:var(--fg)}
.team .who{display:flex;align-items:center;gap:8px;font-size:15px}
.team .who .n{width:34px;height:34px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font:600 14px var(--f-display)}
.bar{position:relative;height:30px;border-radius:var(--r-pill);background:var(--muted-2);overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--lime);border-radius:var(--r-pill)}
.bar span{position:relative;display:block;padding:0 14px;font-size:12.5px;line-height:30px;color:var(--on-accent);font-weight:500}

.note{font-size:13px;color:var(--fg-2);background:var(--surface);border-radius:20px;padding:12px 16px}

/* schedule */
.week{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;text-align:center}
.wk{display:flex;flex-direction:column;align-items:center;gap:8px}
.wk .w{font:500 14px var(--f-body);color:var(--fg-2)}
.wk .d{position:relative;width:46px;height:46px;max-width:100%;border-radius:50%;display:grid;place-items:center;background:var(--muted);font:600 17px var(--f-display);transition:transform .15s}
.wk .d .hb{position:absolute;right:-6px;top:-6px;width:22px;height:22px;border-radius:50%;background:var(--lav);color:#1B1B1B;display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg)}
.wk .d .hb svg{width:13px;height:13px}
.wk[aria-pressed="true"] .d{background:var(--lime);color:var(--on-accent);box-shadow:0 0 0 3px var(--bg),0 0 0 4.5px var(--lime-deep)}
.wk{gap:7px}
.trail{--ring:var(--bg);display:flex;justify-content:center;min-height:20px}
.trail i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;margin-left:-7px;box-shadow:0 0 0 1.5px var(--ring)}
.trail i:first-child{margin-left:0}
.trail svg{width:11px;height:11px}
.trail.lg{--ring:var(--muted);justify-content:flex-start;min-height:34px}

.detail{position:relative}

/* budget */
.big{background:var(--ink-card);color:var(--on-ink);border-radius:var(--r-xl);padding:22px 20px;display:flex;flex-direction:column;gap:14px}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---- one visual system across tabs ---- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:10px 4px 4px}
.ph h1{margin:0;font:500 34px/1.1 var(--f-body);letter-spacing:.02em}
.ph .ib{background:var(--surface)}
.ph .ib.on{background:#1B1B1B;color:#fff}
.phn{font:500 26px var(--f-display);font-variant-numeric:tabular-nums}
.phn small{font-size:16px;opacity:.5}
.hero h1{font:500 22px/1.2 var(--f-body)}
/* date strip: tall coloured capsules */
.week{gap:6px}
.wk{position:relative;gap:2px;padding:10px 0 12px;border-radius:999px;background:var(--muted);color:var(--fg);transition:background .2s}
.wk .w{font:500 12.5px var(--f-body);color:inherit;opacity:.65}
.wk .d{width:auto;height:auto;background:none!important;box-shadow:none!important;font:500 20px var(--f-display);color:inherit!important}
.wk[aria-pressed="true"]{background:var(--c);color:var(--t)}
.wk[aria-pressed="true"] .w{opacity:.8}
.wk .hb{position:absolute;top:-4px;right:-2px;width:20px;height:20px;border-radius:50%;background:var(--lav);color:#1B1B1B;display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg)}
.wk .hb svg{width:11px;height:11px}
/* day heading: coloured, no rule line */
.dayhead{border-top:0;padding:6px 4px 0;border-radius:0;background:none;color:var(--fg);align-items:center}
.dayhead .sub{display:block;font:500 13px var(--f-body);color:inherit;opacity:.7}
.dayhead h2{font:500 20px/1.35 var(--f-body);margin-top:2px}
.dayhead .dh-t{flex:1;min-width:0}
.stp2{flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;background:var(--muted);font:500 13px var(--f-body);white-space:nowrap}
.stp2 svg{width:15px;height:15px}
/* money: colourful total instead of black */
.big{background:var(--lime);color:#1B1B1B;border-radius:34px}
.big .lab,.big .s{color:inherit;opacity:.65}
.big .v em{color:inherit;opacity:.45}
/* todo: colourful progress */
.bar{height:12px;background:var(--surface)}
.bar i{background:var(--lav)}
.bar span{display:none}
/* lighter navigation */
.nav{background:var(--surface);box-shadow:0 10px 30px rgba(0,0,0,.12)}
.nav button{background:transparent;color:var(--fg-2)}
.nav button[aria-current="page"]{background:var(--fg);color:var(--bg)}
.nav button .d{border-color:var(--surface)}
/* one type scale */
.wh h3{font:500 20px var(--f-body)}
.fd h3{font-weight:500}

/* White translucent inner-glow watermark on expanded concert cards. */
.concert-print{position:absolute;right:-28px;bottom:76px;width:88%;aspect-ratio:3/1;pointer-events:none;transform:rotate(-16deg);z-index:0;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20780%20260%22%3E%3Cdefs%3E%3Cmask%20id%3D%22cuts%22%3E%3Crect%20width%3D%22780%22%20height%3D%22260%22%20fill%3D%22white%22%2F%3E%3Ccircle%20cx%3D%22130%22%20cy%3D%22130%22%20r%3D%2229%22%20fill%3D%22black%22%2F%3E%3Cpath%20d%3D%22M260%2090H780M260%20170H780%22%20stroke%3D%22black%22%20stroke-width%3D%2223%22%2F%3E%3Cpath%20d%3D%22M650%20101V159%22%20stroke%3D%22black%22%20stroke-width%3D%2217%22%2F%3E%3C%2Fmask%3E%3Cfilter%20id%3D%22inner%22%20color-interpolation-filters%3D%22sRGB%22%3E%3CfeGaussianBlur%20in%3D%22SourceAlpha%22%20stdDeviation%3D%2210%22%20result%3D%22soft%22%2F%3E%3CfeComposite%20in%3D%22SourceAlpha%22%20in2%3D%22soft%22%20operator%3D%22out%22%20result%3D%22edge%22%2F%3E%3CfeFlood%20flood-color%3D%22white%22%20flood-opacity%3D%220.95%22%2F%3E%3CfeComposite%20in2%3D%22edge%22%20operator%3D%22in%22%20result%3D%22glow%22%2F%3E%3CfeFlood%20flood-color%3D%22white%22%20flood-opacity%3D%220.08%22%2F%3E%3CfeComposite%20in2%3D%22SourceAlpha%22%20operator%3D%22in%22%20result%3D%22wash%22%2F%3E%3CfeMerge%3E%3CfeMergeNode%20in%3D%22wash%22%2F%3E%3CfeMergeNode%20in%3D%22glow%22%2F%3E%3C%2FfeMerge%3E%3C%2Ffilter%3E%3C%2Fdefs%3E%3Cg%20filter%3D%22url%28%23inner%29%22%3E%3Cg%20fill%3D%22white%22%20mask%3D%22url%28%23cuts%29%22%3E%3Ccircle%20cx%3D%22130%22%20cy%3D%22130%22%20r%3D%22112%22%2F%3E%3Ccircle%20cx%3D%22390%22%20cy%3D%22130%22%20r%3D%22112%22%2F%3E%3Ccircle%20cx%3D%22650%22%20cy%3D%22130%22%20r%3D%22112%22%2F%3E%3C%2Fg%3E%3C%2Fg%3E%3C%2Fsvg%3E") center/contain no-repeat}
.fd.dk .concert-print{opacity:.55}
.fd .hd,.fd .r2{position:relative;z-index:2;pointer-events:none}
.fd .r2 .ar{pointer-events:auto}

  const hm=v=>{v=((Math.round(v)%1440)+1440)%1440;return String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0')};
  const timed=[];
  items.forEach((it,k)=>{
    const t=(it.t||'').trim(); if(!((!t||t==='未定')&&geo(it)))return;
    let end=null;
    for(let m=k-1;m>=0;m--){const c=clockOf(items[m].t);if(c==null)continue;const e=clockOf(items[m].e);end=e!=null&&e>c?e:c+60;break}
    if(end==null)return;
    const start=Math.ceil((end+10)/15)*15; /* ~10 min to get there, rounded to the quarter hour */
    let fin=start+(it.cat==='shop'?60:it.cat==='food'?45:30);
    for(let m=k+1;m<items.length;m++){const c=clockOf(items[m].t);if(c==null)continue;if(c<fin)fin=Math.max(start+15,c);break}
    const o=PL.ov[it.id]||(PL.ov[it.id]={});o.t=hm(start);o.e=hm(fin);
    timed.push(`${it.title} ${hm(start)}`);
  });
  /* 2. shopping stops sitting between two fixed points: find the shortest walk through them */
  let i=0;
  while(i<items.length){
    if(items[i].cat!=='shop'||!geo(items[i])){i++;continue}
    let j=i;while(j<items.length&&items[j].cat==='shop'&&geo(items[j]))j++;
    const seg=items.slice(i,j);
    if(seg.length>1&&seg.length<=7){
      const prev=(()=>{for(let k=i-1;k>=0;k--){const g=geo(items[k]);if(g)return g}return null})();
      const next=(()=>{for(let k=j;k<items.length;k++){const g=geo(items[k]);if(g)return g}return null})();
      const cost=o=>{let c=0,p=prev;o.forEach(x=>{const g=geo(x);if(p)c+=dist(p,g);p=g});if(next)c+=dist(p,next);return c};
      const best=perms(seg).reduce((b,o)=>cost(o)<cost(b)-1e-9?o:b,seg);
      if(best.some((x,k)=>x.id!==seg[k].id)){
        best.forEach((x,k)=>{out[i+k]=x});
        /* time slots stay where they were, the stops move between them */
        seg.forEach((slot,k)=>{const it=best[k];const o=PL.ov[it.id]||(PL.ov[it.id]={});o.t=slot.t;o.e=slot.e||''});
      }
    }
    i=j;
  }
  const moved=out.filter((x,k)=>x.id!==before[k].id).length;
  if(!moved&&!timed.length){toast('目前的順序已經照時間、也是最順的路線了');return}
  PL.order[day.d]=out.map(x=>x.id);savePL();renderAll();
  toast(timed.length?`已排進 ${timed.join('、')}，順路又不擠到前後行程`:`已照時間和路線重新排好 ${moved} 站`,true);
}

  if(t.dataset.wedit){const id=t.dataset.wedit;wishEdit.has(id)?wishEdit.delete(id):wishEdit.add(id);renderPlan();if(wishEdit.has(id)){const f=document.querySelector(`[data-wf="${t.dataset.focus||'web'}"][data-wid="${id}"]`);f&&f.focus()}return}
  if(t.dataset.del){const id=t.dataset.del;removeFromDay(id);savePL();renderAll();return}
  if(t.dataset.towish){const day=DAYS.find(x=>x.d===curDay),it=itemsOf(day).find(x=>x.id===t.dataset.towish);
    WISH.push({id:'w'+uid(),title:it.title,cat:it.cat,d:curDay,note:it.note||'',cost:it.cost||null,q:it.q||'',web:it.web||''});saveWish();removeFromDay(it.id);savePL();renderAll();return}
  if('wishopen' in t.dataset){wishOpen=true;renderPlan();const f=document.getElementById('wf-title');f&&f.focus();return}
  if('wishcancel' in t.dataset){wishOpen=false;renderPlan();return}
  if(t.dataset.wishcat){wishCat=t.dataset.wishcat;t.parentNode.querySelectorAll('[data-wishcat]').forEach(b=>b.setAttribute('aria-pressed',String(b===t)));return}
  if('wishsave' in t.dataset){const title=(document.getElementById('wf-title').value||'').trim();if(!title){document.getElementById('wf-title').focus();return}
    {const rw=(document.getElementById('wf-web').value||'').trim();WISH.push({id:'w'+uid(),title,cat:wishCat,area:wishTab==='未定'?undefined:wishTab,note:(document.getElementById('wf-note').value||'').trim(),web:normUrl(rw),rawWeb:rw})}saveWish();wishOpen=false;renderPlan();return}
  if(t.dataset.wdel){WISH=WISH.filter(w=>w.id!==t.dataset.wdel);saveWish();renderPlan();return}
  if(t.dataset.wadd){const w=WISH.find(x=>x.id===t.dataset.wadd);const it={id:uid(),t:'未定',title:w.title,cat:w.cat,note:w.note||''};
    if(w.cost)it.cost=w.cost; if(w.q)it.q=w.q; if(w.web)it.web=w.web; if(w.cat==='move')it.mode='car';
    fixPL();(PL.add[curDay]=PL.add[curDay]||[]).push(it);WISH=WISH.filter(x=>x.id!==w.id);saveWish();savePL();openItems.add(it.id);renderAll();
    const el=document.querySelector(`li[data-id="${it.id}"]`);el&&el.scrollIntoView({block:'center',behavior:'smooth'});return}
  if(t.classList.contains('row')){const id=t.closest('li').dataset.id,d=document.getElementById(t.getAttribute('aria-controls'));const open=t.getAttribute('aria-expanded')==='true';t.setAttribute('aria-expanded',String(!open));d.hidden=open;open?openItems.delete(id):openItems.add(id)}
});
window.__applyRemote=function(st){
  if(st.pl&&st.pl.order)PL=JSON.parse(JSON.stringify(st.pl)); fixPL();
  if(Array.isArray(st.wish))WISH=JSON.parse(JSON.stringify(st.wish));
  DONE=JSON.parse(JSON.stringify(st.done||{}));
  checks=JSON.parse(JSON.stringify(st.checks||{}));
  if(st.money&&Array.isArray(st.money.stays)){MONEY=JSON.parse(JSON.stringify(st.money));MONEY.extras=MONEY.extras||[]}
  render();
};
render();
})();};
</script>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {initializeFirestore,persistentLocalCache,doc,getDoc,setDoc,deleteDoc,onSnapshot,collection,getDocs,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const OWNER='chu7226@gmail.com';
const app=initializeApp({apiKey:"AIzaSyCbTYNm8lSVcKDgQ21ADLg9ufAUEHubPWw",authDomain:"years-9f525.firebaseapp.com",projectId:"years-9f525",storageBucket:"years-9f525.firebasestorage.app",messagingSenderId:"637618946821",appId:"1:637618946821:web:55be991b72baf227c6ed6c"});
const auth=getAuth(app);
let db;try{db=initializeFirestore(app,{localCache:persistentLocalCache()})}catch(e){db=initializeFirestore(app,{})}
const $=id=>document.getElementById(id);
const msg=(t,showIn,showOut)=>{$('gmsg').textContent=t;$('gin').hidden=!showIn;$('gout').hidden=!showOut};
const prov=new GoogleAuthProvider();prov.setCustomParameters({prompt:'select_account'});
/* LINE / FB / IG in-app browsers cannot do Google sign-in: send LINE to the real browser, ask others to switch */
const UA=navigator.userAgent||'';
const inApp=/Line\/|FBAN|FBAV|FB_IAB|Instagram|MicroMessenger|KAKAOTALK|WhatsApp|Messenger/i.test(UA);
if(/Line\//i.test(UA)&&!/[?&]openExternalBrowser=1/.test(location.search)){location.replace(location.origin+location.pathname+'?openExternalBrowser=1'+location.hash)}
function inAppMsg(){$('gmsg').innerHTML='你現在是用 App 內建的瀏覽器開的，Google 不允許在這裡登入。<br>請按右上角「⋯」選「用 Safari 開啟」，或複製網址貼到 Safari。';$('gin').hidden=true;$('gout').hidden=true;
  if(!$('gcopy')){const b=document.createElement('button');b.id='gcopy';b.className='gbtn';b.textContent='複製網址';b.onclick=()=>{const u=location.origin+location.pathname;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>b.textContent='已複製，貼到 Safari 打開',()=>prompt('複製這個網址，貼到 Safari：',u))};$('gin').after(b)}}

$('gin').onclick=async()=>{
  if(inApp){inAppMsg();return}
  try{await signInWithPopup(auth,prov)}
  catch(e){
    if(e.code==='auth/popup-blocked')msg('登入視窗被擋住了，請允許彈出視窗後再按一次。',true,false);
    else if(e.code==='auth/operation-not-supported-in-this-environment'||e.code==='auth/web-storage-unsupported')inAppMsg();
    else if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')msg('登入失敗，請再試一次（'+e.code+'）',true,false);
  }
};
getRedirectResult(auth).catch(()=>{});
const out=()=>signOut(auth).then(()=>location.reload());
$('gout').onclick=out;$('sout').onclick=out;

let started=false, me='', isOwner=false;
onAuthStateChanged(auth,async u=>{
  if(!u){if(inApp){inAppMsg();return}msg('只有受邀的朋友可以進來，請用你的 Google 帳號登入。',true,false);return}
  me=(u.email||'').toLowerCase(); isOwner=me===OWNER;
  msg('確認權限中…',false,false);
  try{
    if(!isOwner){const m=await getDoc(doc(db,'members',me));if(!m.exists())throw {code:'permission-denied'}}
    const d=await getDoc(doc(db,'trip','data'));
    if(!d.exists()){msg(isOwner?'登入成功，行程資料還沒匯入。':'行程還沒準備好，晚點再來看看。',false,true);window.__seed=isOwner?seed:null;return}
    boot(JSON.parse(d.data().json));
  }catch(e){
    if(e&&(e.code==='permission-denied'||e.code==='firestore/permission-denied'))msg(`${me} 還沒有被加入名單，請主辦人把你的 Gmail 加進成員。`,false,true);
    else msg('連線失敗，請確認網路後重新整理（'+(e&&e.code||e)+'）',false,true);
  }
});
async function seed(json){if(!isOwner)throw 'not owner';await setDoc(doc(db,'trip','data'),{json:typeof json==='string'?json:JSON.stringify(json),at:serverTimestamp()});location.reload()}

/* shared state: one doc, each key stored as a JSON string */
const stRef=()=>doc(db,'trip','state');
const last={}; const timers={}; let pending=null;
function parse(data){const o={};['pl','wish','done','checks','money'].forEach(k=>{if(data&&typeof data[k]==='string'){try{o[k]=JSON.parse(data[k])}catch(e){}}});return o}
function SAVE(k,v){
  const j=JSON.stringify(v===undefined?null:v); last[k]=j;
  clearTimeout(timers[k]);
  timers[k]=setTimeout(()=>{setDoc(stRef(),{[k]:j,by:me,at:serverTimestamp()},{merge:true}).catch(e=>console.warn('save',e))},350);
}
const typing=()=>{const a=document.activeElement;return a&&a.closest&&a.closest('.app')&&/^(INPUT|TEXTAREA)$/.test(a.tagName)};
function applyRemote(data){
  const changed=['pl','wish','done','checks','money'].some(k=>typeof data[k]==='string'&&data[k]!==last[k]);
  if(!changed)return;
  ['pl','wish','done','checks','money'].forEach(k=>{if(typeof data[k]==='string')last[k]=data[k]});
  if(typing()){pending=data;return}
  window.__applyRemote&&window.__applyRemote(parse(data));
}
document.addEventListener('focusout',()=>setTimeout(()=>{if(pending&&!typing()){const p=pending;pending=null;window.__applyRemote&&window.__applyRemote(parse(p))}},50));

function boot(T){
  onSnapshot(stRef(),{includeMetadataChanges:true},s=>{
    $('sync').hidden=!s.metadata.fromCache||navigator.onLine;
    const data=s.exists()?s.data():{};
    if(!started){
      started=true;
      ['pl','wish','done','checks','money'].forEach(k=>{if(typeof data[k]==='string')last[k]=data[k]});
      window.__startApp(T,parse(data),SAVE);
      document.querySelector('.nav').appendChild($('acct'));
      document.body.classList.add('ready');
      return;
    }
    if(s.metadata.hasPendingWrites)return;
    applyRemote(data);
  },e=>msg('沒有讀取權限（'+e.code+'）',false,true));
}
addEventListener('online',()=>$('sync').hidden=true);
addEventListener('offline',()=>$('sync').hidden=false);

/* account sheet + members (owner only) */
$('acct').onclick=()=>{$('sme').textContent='已登入：'+me;$('mbox').hidden=!isOwner;$('mbox').style.display=isOwner?'flex':'none';$('sheet').hidden=false;if(isOwner)loadMembers()};
$('shx').onclick=()=>$('sheet').hidden=true;
$('sheet').onclick=e=>{if(e.target.id==='sheet')$('sheet').hidden=true};
const escH=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function loadMembers(){
  $('mmsg').textContent='';
  try{
    const q=await getDocs(collection(db,'members'));
    const rows=[`<div class="mrow"><span>${escH(OWNER)}</span><small>主辦人</small></div>`];
    q.forEach(d=>rows.push(`<div class="mrow"><span>${escH(d.id)}</span><button class="wb ghost" data-mrm="${escH(d.id)}" aria-label="移除 ${escH(d.id)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 7h15M10 7V4.5h4V7M6.5 7l1 12.5h9l1-12.5"/></svg></button></div>`));
    $('mlist').innerHTML=rows.join('');
  }catch(e){$('mmsg').textContent='讀取成員失敗（'+e.code+'）'}
}
$('mlist').onclick=async e=>{const b=e.target.closest('[data-mrm]');if(!b)return;if(!confirm('要把 '+b.dataset.mrm+' 移出名單嗎？他之後就打不開了。'))return;try{await deleteDoc(doc(db,'members',b.dataset.mrm));loadMembers()}catch(err){$('mmsg').textContent='移除失敗（'+err.code+'）'}};
$('madd').onclick=async()=>{
  const v=$('memail').value.trim().toLowerCase();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){$('mmsg').textContent='請輸入完整的 Gmail，例如 friend@gmail.com';return}
  try{await setDoc(doc(db,'members',v),{at:serverTimestamp()});$('memail').value='';loadMembers()}catch(e){$('mmsg').textContent='加入失敗（'+e.code+'）'}
};
</script>
